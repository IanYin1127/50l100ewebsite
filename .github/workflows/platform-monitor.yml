name: 平台动态采集与网站发布
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: platform-monitor-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验采集与状态规则
        run: python -m unittest discover -s tests -v
      - name: 核查苏州机构目录与新增正式认定
        run: python scripts/audit_platforms.py
      - name: 采集已确认官方来源
        run: python scripts/collect_updates.py
      - name: 保存动态与监测记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js monitoring/sources.json monitoring/snapshot.json monitoring/audit.json monitoring/audit-report.md monitoring/audit.csv monitoring-data.js
          if ! git diff --cached --quiet; then
            git commit -m "更新平台公开动态与来源检查记录"
            git push origin HEAD:main
          fi
      - name: 生成纯静态网站目录
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js monitoring-data.js _site/
          cp -- *.xlsx *.xls _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
